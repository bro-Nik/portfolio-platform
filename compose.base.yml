name: portfolios

include:
  - path: ./backend/services/portfolios/compose.base.yml
  - path: ./backend/services/auth/compose.base.yml
  - path: ./backend/services/market/compose.base.yml
  - path: ./frontend/user/compose.base.yml
  - path: ./frontend/admin/compose.base.yml

services:
  nginx:
    image: nginx:alpine
    depends_on:
      - ui-user
      - ui-admin
      - portfolios
      - auth
      - market

  redis:
    image: redis:alpine
    command: redis-server --appendonly yes --appendfsync everysec
    volumes:
      - redis_db_data:/root/redis
    restart: unless-stopped

networks:
  portfolios-net:
    driver: bridge

volumes:
  redis_db_data:
