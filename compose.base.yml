name: portfolios

# Бюджет соединений PostgreSQL: max_connections по умолчанию 100, каждый процесс
# занимает DB_POOL_SIZE + DB_MAX_OVERFLOW. С web (1 процесс) + воркером (1 процесс)
# + планировщиком (1 процесс) при значениях ниже используется 45 из 100.
# TASKIQ_WORKERS * TASKIQ_MAX_ASYNC_TASKS не должен превышать DB_POOL_SIZE +
# DB_MAX_OVERFLOW, иначе задачи будут упираться в пул и падать по таймауту.
x-taskiq-worker-command: &taskiq-worker-command
  [
    "taskiq", "worker",
    "app.modules.market.taskiq_setup:broker",
    "app.modules.market.tasks",
    "app.modules.auth.tasks",
    "--log-level", "INFO",
    "--workers", "${TASKIQ_WORKERS:-1}",
    "--max-async-tasks", "${TASKIQ_MAX_ASYNC_TASKS:-4}",
  ]

# Логи контейнеров без ротации съедали диск до конца: json-file растёт бесконечно,
# и заполненный диск выглядит как зависшее приложение. Restart-политика нужна
# всем сервисам, а не только БД — упавший backend иначе лежит до вмешательства.
x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    logging: *default-logging
    image: postgres:16-alpine
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    logging: *default-logging
    image: redis:7.4-alpine
    command: redis-server --appendonly yes --appendfsync everysec
    volumes:
      - redis_data:/data
    restart: unless-stopped

  backend:
    restart: unless-stopped
    logging: *default-logging
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: base
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file:
      - path: ./.env
        required: false
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    restart: unless-stopped
    logging: *default-logging
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: base
    command: *taskiq-worker-command
    env_file:
      - path: ./.env
        required: false
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    profiles:
      - worker

  scheduler:
    restart: unless-stopped
    logging: *default-logging
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: base
    command: taskiq scheduler app.modules.market.taskiq_setup:scheduler --log-level INFO
    env_file:
      - path: ./.env
        required: false
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    profiles:
      - worker

  ui-user:
    restart: unless-stopped
    logging: *default-logging
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    environment:
      - VITE_USE_POLLING=true
      - VITE_AUTH_SERVICE_URL=/auth
      - VITE_MARKET_SERVICE_URL=/market
      - VITE_IMAGE_BASE_URL=/market/static/images/tickers/
    env_file:
      - path: ./frontend/user/.env
        required: false
      - path: ./.env
        required: false
    working_dir: /app/user
    command: pnpm run start
    volumes:
      - ./frontend/user/src:/app/user/src
      - ./frontend/user/public:/app/user/public
      - ./frontend/shared/src:/app/shared/src
      - ./frontend/shared/dist:/app/shared/dist

  ui-admin:
    restart: unless-stopped
    logging: *default-logging
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    environment:
      - VITE_USE_POLLING=true
      - VITE_AUTH_SERVICE_URL=/auth
      - VITE_MARKET_SERVICE_URL=/market
      - VITE_IMAGE_BASE_URL=/market/static/images/tickers/
    env_file:
      - path: ./frontend/admin/.env
        required: false
      - path: ./.env
        required: false
    working_dir: /app/admin
    command: pnpm run start
    volumes:
      - ./frontend/admin/src:/app/admin/src
      - ./frontend/admin/public:/app/admin/public
      - ./frontend/shared/src:/app/shared/src
      - ./frontend/shared/dist:/app/shared/dist

  nginx:
    restart: unless-stopped
    logging: *default-logging
    image: nginx:1.27-alpine
    depends_on:
      - ui-user
      - ui-admin
      - backend
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/security_headers.conf:/etc/nginx/snippets/security_headers.conf:ro
      - ./landing:/var/www/landing

networks:
  portfolios-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
