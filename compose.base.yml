name: portfolios

services:
  db:
    image: postgres:16-alpine
    env_file:
      - path: ./.env
        required: false
    environment:
      POSTGRES_USER: portfolios
      POSTGRES_DB: portfolios
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolios"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    command: redis-server --appendonly yes --appendfsync everysec
    volumes:
      - redis_data:/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: base
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file:
      - path: ./.env
        required: false
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: base
    command: taskiq worker app.modules.market.taskiq_setup:broker app.modules.market.tasks app.modules.auth.tasks --log-level INFO
    env_file:
      - path: ./.env
        required: false
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    profiles:
      - worker

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: base
    command: taskiq scheduler app.modules.market.taskiq_setup:scheduler --log-level INFO
    env_file:
      - path: ./.env
        required: false
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    profiles:
      - worker

  ui-user:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WDS_SOCKET_PORT=0
      - FAST_REFRESH=true
      - REACT_APP_AUTH_SERVICE_URL=/auth
      - REACT_APP_MARKET_SERVICE_URL=/market
      - REACT_APP_IMAGE_BASE_URL=/market/static/images/tickers/
    env_file:
      - path: ./frontend/user/.env
        required: false
      - path: ./.env
        required: false
    working_dir: /app/user
    command: pnpm run start
    volumes:
      - ./frontend/user/src:/app/user/src
      - ./frontend/user/public:/app/user/public
      - ./frontend/shared/src:/app/shared/src
      - ./frontend/shared/dist:/app/shared/dist

  ui-admin:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WDS_SOCKET_PORT=0
      - WDS_SOCKET_PATH=/admin/ws
      - FAST_REFRESH=true
      - REACT_APP_AUTH_SERVICE_URL=/auth
      - REACT_APP_MARKET_SERVICE_URL=/market
      - REACT_APP_IMAGE_BASE_URL=/market/static/images/tickers/
    env_file:
      - path: ./frontend/admin/.env
        required: false
      - path: ./.env
        required: false
    working_dir: /app/admin
    command: pnpm run start
    volumes:
      - ./frontend/admin/src:/app/admin/src
      - ./frontend/admin/public:/app/admin/public
      - ./frontend/shared/src:/app/shared/src
      - ./frontend/shared/dist:/app/shared/dist

  nginx:
    image: nginx:alpine
    depends_on:
      - ui-user
      - ui-admin
      - backend
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./landing:/var/www/landing

networks:
  portfolios-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
