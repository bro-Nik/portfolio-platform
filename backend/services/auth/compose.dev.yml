services:
  auth-db:
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust

  auth:
    build:
      target: development
    ports: ["8000:8000"]
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    volumes:
      - ./app:/app/app
      - ./alembic.ini:/app/alembic.ini
      - ../../shared:/shared
