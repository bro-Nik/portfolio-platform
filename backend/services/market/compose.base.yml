services:
  market-db:
    image: postgres:13-alpine
    volumes:
      - market_db_data:/var/lib/postgresql/data

  market:
    build: .
    env_file:
      - ./.env
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on: [market-db]
    volumes:
      - ./app:/app/app
      - ../../../.env:/app/.env.root:ro

  market-celery-worker:
    build: .
    command: celery -A app.core.celery worker --loglevel=info

  market-celery-beat:
    build: .
    command: celery -A app.core.celery beat --loglevel=info --scheduler redbeat.RedBeatScheduler

volumes:
  market_db_data:
