services:
  portfolios-db:
    image: postgres:13-alpine
    container_name: portfolios-db
    volumes:
      - backend_db_data:/var/lib/postgresql/data

  portfolios:
    build: .
    container_name: portfolios
    env_file:
      - ./.env
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on: [portfolios-db]
    volumes:
      - ./app:/app/app
      - ../../../.env:/app/.env.root:ro

volumes:
  backend_db_data:
