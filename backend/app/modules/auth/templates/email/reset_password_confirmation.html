<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Пароль изменён</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f6f9;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
  <table role="presentation" style="width:100%;border-collapse:collapse">
    <tr>
      <td align="center" style="padding:40px 16px">
        <table role="presentation" style="max-width:560px;width:100%;border-collapse:collapse">
          <tr>
            <td style="background:#ffffff;border-radius:12px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,0.08)">
              <table role="presentation" style="width:100%;border-collapse:collapse">
                <tr>
                  <td style="background:#f8f9fa;padding:24px 32px;text-align:center;border-bottom:1px solid #e2e8f0">
                    <a href="{{ frontend_url }}" style="color:#1e293b;text-decoration:none;display:inline-flex;align-items:center;gap:10px">
                      <img src="cid:favicon@portfolios.app" alt="" width="28" height="28" style="display:block">
                      <span style="font-size:22px;letter-spacing:-0.3px">Portfolios</span>
                    </a>
                  </td>
                </tr>
                <tr>
                  <td style="padding:40px 32px">
                    <h2 style="color:#1e293b;margin:0 0 12px;font-size:22px;font-weight:600">
                      Пароль успешно изменён
                    </h2>
                    <p style="color:#64748b;margin:0 0 8px;font-size:16px;line-height:1.5">
                      Пароль для аккаунта <strong style="color:#334155">{{ email }}</strong> был изменён.
                    </p>
                    <p style="color:#64748b;margin:28px 0 0;font-size:16px;line-height:1.5">
                      Если вы не меняли пароль, немедленно сбросьте его на сайте.
                    </p>
                  </td>
                </tr>
                <tr>
                  <td style="background:#f8fafc;padding:20px 32px;border-top:1px solid #e2e8f0">
                    <p style="color:#94a3b8;margin:0;font-size:12px;text-align:center">
                      Portfolios &mdash; управляйте своими инвестициями
                    </p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
