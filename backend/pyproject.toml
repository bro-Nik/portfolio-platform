[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # Игнорировать проверку кириллических символов
    "RUF001", "RUF002", "RUF003",

    # Игнорировать проверку статичных словарей
    "RUF012",

    # Игнорировать docstring
    "D101",  # Отсутствие docstring в class
    "D107",  # Отсутствие docstring в __init__
    "D100",  # Отсутствие docstring в public module
    "D104",  # Отсутствие docstring в public package
    "D102",  # Отсутствие docstring в public method
    "D103",  # Отсутствие docstring в public function
    "D105",  # Отсутствие docstring в magic method
    "D203", "D213",  # конфликтуют с D211/D212

    # Игнорировать строгие проверки для обработки ошибок
    "EM101", "EM102",  # Слишком широкие/узкие исключения
    "TRY003",         # Неправильный тип исключения

    # Игнорировать строгие проверки для TODO комментариев
    "TD002", "TD003",

    # Игнорировать предупреждения о переопределении встроенных имен
    "A001", "A002",

    # Игнорировать предупреждения о типизации
    "ANN003",

    # Копирайт-заголовок не используется в проекте
    "CPY001",

    # Явные __init__.py в пакетах не добавляются
    "INP001",

    # Строки в сообщениях об ошибках читаются как текст, не как формат
    "COM812",

    # Технический долг, который разбирается постепенно. Список можно сокращать
    # по мере рефакторинга; CI уже гейтит всё остальное.
    "E501",       # длинные строки в основном в миграциях и запросах
    "PLR0913",    # сервисы-оркестраторы принимают много аргументов
    "PLR0917",
    "PLR0912",    # sync_tickers разбит на функции в отдельной задаче
    "PLR0915",
    "C901",
    "PLR2004",    # магические числа в проверках провайдеров
    "FBT001",     # булевы флаги в сервисах рынка
    "FBT002",
    "FBT003",
    "ANN401",     # Any в протоколах и декораторах
    "ANN002",     # *args в декораторах
    "ARG002",     # аргументы, необходимые по сигнатуре провайдера
    "ARG003",
    "B008",       # Depends() в аргументах — стандартный паттерн FastAPI
    "ASYNC109",   # имя параметра timeout совпадает с httpx
    "S105",       # строки вроде ACCESS_TOKEN_TYPE не являются паролями
    "BLE001",     # фоновые задачи ловят всё и пишут в task.last_run_result
    "S110",       # там же: best-effort логирование
    "PLC0415",    # локальные импорты для разрешения циклов
    "SLF001",     # доступ к приватным полям внутри пакета
    "TRY300",     # ветвление внутри except
]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"      # Одинарные кавычки для inline строк
multiline-quotes = "double"   # Двойные кавычки для многострочных строк
docstring-quotes = "double"   # Двойные кавычки для docstring

[tool.ruff.lint.isort]
known-local-folder = ["app"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]
combine-as-imports = true             # Объединять as-импорты
force-sort-within-sections = true     # Сортировка внутри секций

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

# Правила в роутах
"app/modules/*/routes/**/*.py" = [
    "PLR0913",  # Максимальное количество аргументов
    "ARG001",   # Неиспользуемый аргумент (для request в rate limiting)
]

# Правила в тестах
"tests/**/*.py" = [
    "S101",     # использование assert
    "ANN201",   # отсутствует аннотация типа возврата
    "ANN001",   # отсутствует аннотация типа
    "ANN202",   # отсутствует аннотация типа возврата
    "ANN003",   # отсутствует аннотация типа для *args/**kwargs
    "S105",     # жестко заданный пароль в коде
    "S106",     # жестко заданный пароль в коде
    "PLR2004",  # магические числа
    "SLF001",   # обращение к приватным членам
    "ARG001",   # неиспользуемые аргументы фикстур
    "ARG002",   # неиспользуемые аргументы фикстур
    "D101",     # отсутствие docstring в публичном классе
    "D102",     # отсутствие docstring в публичном методе
    "D103",     # отсутствие docstring в публичной функции
    "E501",     # слишком длинная строка
    "PLR0913",  # количество аргументов у параметризованных тестов
    "PLR0917",  # количество позиционных аргументов у параметризованных тестов
    "PT012",    # pytest.raises с несколькими выражениями
    "PT022",    # фикстуры без teardown
    "PLC0415",  # локальные импорты в фикстурах
]

# Правила для Alembic миграций: шаблоны alembic заданы генератором
"app/alembic/versions/*.py" = [
    "D", "ANN", "COM812", "F401", "INP001", "UP006", "UP035", "UP045",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
pythonpath = ["."]
addopts = "--strict-markers"

[tool.pyright]
include = ["app"]
typeCheckingMode = "basic"
pythonVersion = "3.13"
