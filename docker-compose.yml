include:
  - path: ./backend/services/portfolios/compose.base.yml
  - path: ./backend/services/auth/compose.base.yml
  - path: ./backend/services/market/compose.base.yml
  - path: ./frontend/user/compose.base.yml

services:
  admin-frontend:
    build:
      context: ./admin-frontend
      dockerfile: Dockerfile
    container_name: admin-frontend
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WDS_SOCKET_PORT=0
      - FAST_REFRESH=true
      - REACT_APP_AUTH_SERVICE_URL=/auth
      - REACT_APP_MARKET_SERVICE_URL=/market
      - REACT_APP_IMAGE_BASE_URL=/market/static/images/tickers/
    depends_on:
      - portfolios
      - auth
    volumes:
      - ./admin-frontend/src:/app/src
      - ./admin-frontend/public:/app/public
    networks:
      - portfolios-net
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "8081:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - ui-user
      - portfolios
      - auth
    networks:
      - portfolios-net

  adminer:
    image: adminer
    restart: unless-stopped
    ports:
      - "8082:8080"
    depends_on:
      - auth-db
    networks:
      - portfolios-net

  redis:
    image: redis:latest
    container_name: redis
    restart: on-failure
    volumes:
      - redis_db_data:/root/redis
    networks:
      - portfolios-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  portfolios-net:
    driver: bridge

volumes:
  auth_db_data:
  backend_db_data:
  market_db_data:
  redis_db_data:
