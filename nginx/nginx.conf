events {}

http {
    upstream ui-user {
        server ui-user:3000;
    }

    upstream ui-admin {
        server ui-admin:3000;
    }

    upstream portfolios {
        server portfolios:8000;
    }

    upstream market {
        server market:8003;
    }

    upstream auth {
        server auth:8001;
    }

    # Публичный сервер - только для внешних запросов
    server {
        listen 80;
        server_name localhost;

        # User Frontend
        location / {
            proxy_pass http://ui-user;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Admin Frontend
        location /admin/ {
            proxy_pass http://ui-admin;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Portfolios Api
        location /api/ {
            location /api/internal/ {
                deny all;
                return 404;
            }
            proxy_pass http://portfolios;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Market Api
        location /market/ {
            proxy_pass http://market/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Auth Api
        location /auth/ {
            proxy_pass http://auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Внутренний сервер - только для микросервисов
    server {
        listen 81;
        allow 172.16.0.0/12;  # Только Docker
        deny all;
        server_name internal;
        
        location /api/internal/ {
            proxy_pass http://portfolios;
        }
    }
}
