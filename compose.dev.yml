services:
  auth:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload
    volumes:
      - ./backend/services/auth/app:/app/app
      - ./backend/services/auth/alembic.ini:/app/alembic.ini
      - ./backend/shared:/shared

  portfolios:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend/services/portfolios/app:/app/app
      - ./backend/services/portfolios/alembic.ini:/app/alembic.ini
      - ./backend/shared:/shared

  market:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8003 --reload
    volumes:
      - ./backend/services/market/app:/app/app
      - ./backend/shared:/shared

  market-worker:
    build:
      target: development
    command: taskiq worker app.core.taskiq:broker app.tasks --log-level INFO
    volumes:
      - ./backend/services/market/app:/app/app
      - ./backend/shared:/shared
    depends_on:
      - redis

  market-scheduler:
    build:
      target: development
    command: taskiq scheduler app.core.taskiq:scheduler --log-level INFO
    volumes:
      - ./backend/services/market/app:/app/app
      - ./backend/shared:/shared
    depends_on:
      - redis

  nginx:
    ports: ["8081:80"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf

  adminer:
    image: adminer
    ports: ["8082:8080"]
