name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.13'
  PNPM_VERSION: '11.13.1'

jobs:
  backend-lint:
    name: backend lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          version: 0.16.1
      - run: ruff format --check .

  frontend-lint:
    name: frontend lint + typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # user — JavaScript-приложение: tsc проверяет только .ts, включая
      # сгенерированный клиент. Это известное ограничение, не тихая проверка.
      - run: pnpm typecheck

  backend-tests:
    name: backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build test image
        run: docker compose -f compose.test.yml build backend-tests
      - name: Run tests
        # Аргументы передаются явно: `docker compose run ARGS` заменяет command
        # сервиса и молча теряет pytest/--cov.
        run: |
          docker compose -f compose.test.yml run --rm backend-tests \
            pytest tests/ -q --cov=app --cov-report=xml --cov-report=term-missing
      - if: always()
        run: docker compose -f compose.test.yml logs backend-tests || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

  frontend-tests:
    name: frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @portfolio/user test:ci
      - run: pnpm --filter @portfolio/admin test:ci

  migrations:
    name: migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build test image
        run: docker compose -f compose.test.yml build backend-tests
      # Тесты собирают схему через create_all, поэтому расхождение моделей и
      # миграций было невидимо. Здесь БД строится только из миграций.
      - name: Drift check
        run: |
          docker compose -f compose.test.yml up -d test-db
          docker compose -f compose.test.yml run --rm backend-tests sh -c \
            "cd app && alembic upgrade head && PYTHONPATH=/app alembic check"
      - name: Upgrade / downgrade / upgrade
        run: |
          docker compose -f compose.test.yml run --rm backend-tests sh -c \
            "cd app && alembic downgrade base && alembic upgrade head && alembic current"
      - if: always()
        run: docker compose -f compose.test.yml logs || true

  build:
    name: docker build
    runs-on: ubuntu-latest
    needs: [backend-lint, frontend-lint]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: production
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - uses: docker/setup-buildx-action@v3
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
